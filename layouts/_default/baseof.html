<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if not .IsHome }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.subtitle }}{{ end }}">
<meta name="theme-color" content="hsl(31, 92%, 62%)">
<link rel="stylesheet" href="/css/style.css">
<link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="/rss.xml">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
{{ with .Site.Params.googleAnalyticsId }}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','{{ . }}');</script>
{{ end }}
{{ hugo.Generator }}
</head>
<body>
<script>(function(){var m;try{var p=JSON.parse(localStorage.getItem('diesel:theme-atom'));if(p&&p.mode)m=p.mode;}catch(e){}if(!m)m=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.classList.toggle('dark',m==='dark');})();</script>
<div class="layout">
{{ partial "sidebar.html" . }}
<main class="content">{{ block "main" . }}{{ end }}</main>
</div>
<script>document.querySelectorAll('[data-theme-toggle]').forEach(function(b){b.addEventListener('click',function(){var dark=document.documentElement.classList.toggle('dark');try{localStorage.setItem('diesel:theme-atom',JSON.stringify({mode:dark?'dark':'light'}));}catch(e){}});});</script>
<script>
if (window.netlifyIdentity) {
  window.netlifyIdentity.on('init', function(user) {
    if (!user) {
      window.netlifyIdentity.on('login', function() { document.location.href = '/admin/'; });
    }
  });
}
</script>
</body>
</html>
